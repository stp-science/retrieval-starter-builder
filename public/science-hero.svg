<svg width="720" height="460" viewBox="0 0 720 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="76" y1="44" x2="638" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101827"/>
      <stop offset="0.52" stop-color="#173148"/>
      <stop offset="1" stop-color="#244D61"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.045"/>
    </linearGradient>
    <linearGradient id="bio" x1="420" y1="86" x2="560" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#74E1CF"/>
      <stop offset="1" stop-color="#4BA7C1"/>
    </linearGradient>
    <linearGradient id="chem" x1="128" y1="244" x2="238" y2="372" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D477"/>
      <stop offset="1" stop-color="#F08A68"/>
    </linearGradient>
    <linearGradient id="physics" x1="416" y1="276" x2="588" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8FB7FF"/>
      <stop offset="1" stop-color="#D28BFF"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(590 86) rotate(130) scale(190 150)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#77E2D4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#77E2D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(126 350) rotate(-30) scale(190 150)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CF082B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#CF082B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="26" y="10" width="668" height="440" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#07101C" flood-opacity="0.26"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#07101C" flood-opacity="0.24"/>
