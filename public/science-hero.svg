      <g transform="translate(135 254)">
        <path d="M37 0H79" stroke="#F8FBFD" stroke-width="7" stroke-linecap="round"/>
        <path d="M48 0V30L17 91C12 101 19 111 31 111H86C98 111 105 101 100 91L69 30V0" stroke="#F8FBFD" stroke-width="5.5" stroke-linejoin="round"/>
        <path d="M27 72C42 62 57 79 88 65L100 91C105 101 98 111 86 111H31C19 111 12 101 17 91L27 72Z" fill="url(#chem)"/>
        <circle cx="45" cy="83" r="4.5" fill="#FFF6D8"/>
        <circle cx="70" cy="91" r="3.5" fill="#FFF6D8"/>
        <circle cx="82" cy="76" r="3" fill="#FFF6D8"/>
      </g>
      <circle cx="244" cy="259" r="8" fill="#F8D477" fill-opacity="0.9"/>
      <circle cx="226" cy="279" r="4" fill="#F08A68"/>
    </g>

    <!-- physics glass card: wave graph -->
    <g filter="url(#softShadow)">
      <rect x="420" y="260" width="180" height="108" rx="24" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <path d="M443 322H577" stroke="#A9BBC8" stroke-opacity="0.5" stroke-width="2"/>
      <path d="M510 282V347" stroke="#A9BBC8" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="5 6"/>
      <path d="M441 322C454 291 467 291 480 322C493 353 506 353 519 322C532 291 545 291 558 322C567 344 574 340 579 322" stroke="url(#physics)" stroke-width="6" stroke-linecap="round"/>
      <circle cx="510" cy="322" r="7" fill="#CF082B" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2"/>
    </g>

    <!-- atom card -->
    <g filter="url(#softShadow)">
      <rect x="105" y="72" width="150" height="126" rx="24" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <g transform="translate(128 93)" stroke="#DCE8ED" stroke-width="3.5" stroke-linecap="round">
        <ellipse cx="52" cy="42" rx="46" ry="16"/>
        <ellipse cx="52" cy="42" rx="46" ry="16" transform="rotate(60 52 42)"/>
        <ellipse cx="52" cy="42" rx="46" ry="16" transform="rotate(120 52 42)"/>
        <circle cx="52" cy="42" r="8" fill="#CF082B" stroke="none"/>
        <circle cx="98" cy="42" r="4.5" fill="#F8D477" stroke="none"/>
        <circle cx="29" cy="6" r="4.5" fill="#77E2D4" stroke="none"/>
