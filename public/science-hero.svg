    <g opacity="0.92" stroke="#D9E6EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M302 346H351V327H386V346H414"/>
      <path d="M320 337V355"/>
      <path d="M329 332V360"/>
      <circle cx="414" cy="346" r="10" fill="#77E2D4" stroke="none"/>
      <path d="M408 346H420" stroke="#173148"/>
    </g>

