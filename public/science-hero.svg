<svg width="640" height="420" viewBox="0 0 640 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card" x1="54" y1="28" x2="594" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172033"/>
      <stop offset="1" stop-color="#263C54"/>
    </linearGradient>
    <linearGradient id="flask" x1="160" y1="160" x2="215" y2="290" gradientUnits="userSpaceOnUse">
