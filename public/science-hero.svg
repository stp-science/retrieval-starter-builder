    <g fill="#FFFFFF">
      <circle cx="605" cy="238" r="2.5" fill-opacity="0.78"/>
      <circle cx="376" cy="64" r="2" fill-opacity="0.66"/>
      <circle cx="93" cy="217" r="2.5" fill-opacity="0.58"/>
      <circle cx="622" cy="335" r="2" fill-opacity="0.55"/>
