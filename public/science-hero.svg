    <rect x="70" y="38" width="580" height="360" rx="42" fill="url(#dots)"/>
    <rect x="70" y="38" width="580" height="360" rx="42" fill="url(#glowA)"/>
    <rect x="70" y="38" width="580" height="360" rx="42" fill="url(#glowB)"/>
    <rect x="71" y="39" width="578" height="358" rx="41" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="2"/>

    <!-- central molecule network -->
    <g opacity="0.42" stroke="#BCD4DE" stroke-width="2.4">
      <path d="M287 181L349 139L408 176L389 240L318 252L287 181Z"/>
      <path d="M349 139L357 92"/>
      <path d="M408 176L459 151"/>
      <path d="M389 240L431 279"/>
      <path d="M318 252L285 303"/>
      <path d="M287 181L238 153"/>
    </g>
    <g filter="url(#softShadow)">
      <circle cx="349" cy="139" r="9" fill="#F8D477"/>
      <circle cx="408" cy="176" r="10" fill="#77E2D4"/>
      <circle cx="389" cy="240" r="8" fill="#8FB7FF"/>
      <circle cx="318" cy="252" r="9" fill="#F08A68"/>
      <circle cx="287" cy="181" r="8" fill="#D28BFF"/>
      <circle cx="357" cy="92" r="6" fill="#FFFFFF" fill-opacity="0.8"/>
      <circle cx="459" cy="151" r="6" fill="#FFFFFF" fill-opacity="0.8"/>
      <circle cx="431" cy="279" r="6" fill="#FFFFFF" fill-opacity="0.8"/>
      <circle cx="285" cy="303" r="6" fill="#FFFFFF" fill-opacity="0.8"/>
      <circle cx="238" cy="153" r="6" fill="#FFFFFF" fill-opacity="0.8"/>
    </g>

