    <g filter="url(#softShadow)">
      <rect x="420" y="72" width="178" height="142" rx="24" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <circle cx="468" cy="132" r="34" fill="#0E2030" fill-opacity="0.62" stroke="#77E2D4" stroke-width="3"/>
      <circle cx="468" cy="132" r="14" fill="#77E2D4" fill-opacity="0.9"/>
      <path d="M446 120C453 112 460 110 467 113" stroke="#D9FFF8" stroke-width="3" stroke-linecap="round"/>
      <path d="M448 149C457 153 467 154 477 149" stroke="#D9FFF8" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="489" cy="119" rx="6" ry="10" transform="rotate(36 489 119)" fill="#F8D477"/>
      <ellipse cx="447" cy="139" rx="5" ry="8" transform="rotate(-34 447 139)" fill="#8FB7FF"/>
      <g transform="translate(516 96)" stroke-linecap="round">
        <path d="M8 0C48 14 7 32 47 48C72 57 58 78 31 86" stroke="url(#bio)" stroke-width="6"/>
        <path d="M49 0C9 14 50 32 10 48C-15 57 -1 78 26 86" stroke="#8FB7FF" stroke-width="6"/>
        <g stroke="#F8FBFD" stroke-width="2.2" opacity="0.9">
          <path d="M17 8H40"/><path d="M21 23H36"/><path d="M16 39H42"/><path d="M14 55H44"/><path d="M20 71H37"/>
        </g>
      </g>
    </g>

