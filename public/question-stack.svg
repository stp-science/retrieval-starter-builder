    <filter id="qShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#8B0924" flood-opacity=".35"/>
    </filter>
  </defs>

  <ellipse cx="280" cy="456" rx="160" ry="50" fill="#24485C" opacity=".12" filter="url(#soft)"/>
  <circle cx="284" cy="275" r="182" fill="url(#glow)" opacity=".65"/>

