    <radialGradient id="shine" cx="0" cy="0" r="1" gradientTransform="translate(130 105) rotate(48) scale(190)">
      <stop stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
