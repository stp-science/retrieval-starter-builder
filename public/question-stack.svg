      <rect x="76" y="78" width="288" height="296" rx="24" fill="url(#shine)" opacity=".52"/>
      <path d="M92 92C141 70 270 70 346 95" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity=".34"/>
