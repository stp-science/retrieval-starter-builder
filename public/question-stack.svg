<svg width="560" height="560" viewBox="0 0 560 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paperBack" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FBFC"/>
      <stop offset="1" stop-color="#DCE9EE"/>
    </linearGradient>
    <linearGradient id="paperMid" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF2F5"/>
    </linearGradient>
    <linearGradient id="paperFront" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".68" stop-color="#F6FAFB"/>
      <stop offset="1" stop-color="#E6EEF2"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF6C88"/>
      <stop offset=".48" stop-color="#EC2850"/>
      <stop offset="1" stop-color="#B90831"/>
    </linearGradient>
    <linearGradient id="redEdge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF98AA"/>
      <stop offset="1" stop-color="#8E0927"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
