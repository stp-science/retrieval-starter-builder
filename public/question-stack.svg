      <path d="M37 18C51 8 75 7 90 17" stroke="#FF9DA2" stroke-width="6" stroke-linecap="round" opacity=".55"/>
      <circle cx="44" cy="201" r="5" fill="#FF9AA1" opacity=".42"/>
