<svg xmlns="http://www.w3.org/2000/svg" width="440" height="440" viewBox="0 0 440 440" fill="none">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFDF8"/>
      <stop offset=".55" stop-color="#FFFDFB"/>
      <stop offset="1" stop-color="#F1ECE4"/>
    </linearGradient>
    <linearGradient id="paper2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8F5EF"/>
      <stop offset="1" stop-color="#DED8CF"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF4C57"/>
      <stop offset=".45" stop-color="#E20B31"/>
      <stop offset="1" stop-color="#94001C"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#10293B" flood-opacity=".28"/>
    </filter>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#5C5147" flood-opacity=".18"/>
