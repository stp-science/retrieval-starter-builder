  <g filter="url(#shadow)">
    <rect x="82" y="57" width="274" height="316" rx="28" transform="rotate(-8 82 57)" fill="url(#paper2)" stroke="#D6CEC4"/>
    <rect x="62" y="78" width="292" height="312" rx="29" transform="rotate(6 62 78)" fill="#F8F6F1" stroke="#D8D0C8"/>
    <rect x="95" y="52" width="276" height="320" rx="28" transform="rotate(3 95 52)" fill="#FFF9F1" stroke="#DED6CC"/>
