      <path d="M58 0C90 0 115 18 122 47C129 78 115 98 92 118C74 133 67 144 67 163V177H34V159C34 132 44 114 68 94C85 80 94 69 91 53C88 38 77 30 61 30C44 30 34 39 29 54L0 43C8 16 29 0 58 0Z" fill="url(#red)"/>
