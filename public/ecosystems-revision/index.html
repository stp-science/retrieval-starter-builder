<script>
'use strict';
const topics=[
{id:'foundations',icon:'◉',label:'Ecosystem essentials',short:'Essentials',desc:'Biotic and abiotic factors, ecological organisation, abundance and distribution.',meta:'Conditions & distribution',intro:'Start with the language ecologists use to describe living things and the conditions around them.',sections:[
['organisation','Levels of organisation',`<p>Ecology is the study of how organisms interact with each other and with their environment. These levels describe increasingly large groups:</p><div class="levels"><div class="level"><strong>Individual</strong><span>One organism, such as one tūī.</span></div><div class="level"><strong>Population</strong><span>All the organisms of <b>one species</b> living in a particular area: all the tūī in one forest.</span></div><div class="level"><strong>Community</strong><span>All the populations of <b>different species</b> in an area: tūī, trees, insects, fungi and other organisms.</span></div><div class="level"><strong>Ecosystem</strong><span>A community <b>interacting with its non-living environment</b>, including water, light, soil and temperature.</span></div><div class="level"><strong>Biosphere</strong><span>All the parts of Earth where life exists, including every ecosystem.</span></div></div><div class="notice"><b>Community or ecosystem?</b>A community includes living organisms. An ecosystem also includes their interactions with non-living conditions. A <strong>habitat</strong> is the place where an organism lives.</div>`],
['factors','Biotic and abiotic factors',`<div class="two-col"><div class="definition"><h3>Biotic = living</h3><p>Living parts of an ecosystem and interactions between them.</p><p><b>Examples:</b> trees, fungi, bacteria, birds, predators, competition and disease.</p></div><div class="definition"><h3>Abiotic = non-living</h3><p>Physical and chemical conditions that affect living organisms.</p><p><b>Examples:</b> light intensity, rainfall, water availability, temperature, wind, soil texture and soil pH.</p></div></div><p>Both affect survival, growth and reproduction. More predators may reduce prey abundance. A shortage of water may reduce plant growth. These influences act together.</p><div class="notice"><b>Be precise about soil.</b>Soil contains living organisms and non-living material. Name the factor: <strong>soil pH</strong> is abiotic; <strong>earthworms in soil</strong> are biotic.</div>`],
['abundance','Abundance and distribution',`<div class="two-col"><div class="definition"><h3>Abundance = how many or how much</h3><p>The number of individuals of a species in a given area. Plant percentage cover can also be used as a measure of abundance.</p><p>Write the measure clearly: <b>12 daisies per quadrat</b> or <b>40% moss cover</b>.</p></div><div class="definition"><h3>Distribution = where</h3><p>Where organisms occur and how they are spread across an area. They may be clustered, evenly spread or scattered.</p><p>A species could occur mostly near a stream and be absent from drier ground.</p></div></div><figure class="diagram"><div class="switcher" aria-label="Plant distribution display"><button data-pattern="spread" aria-pressed="true">Spread out</button><button data-pattern="clustered" aria-pressed="false">Clustered</button></div><svg id="distribution-svg" viewBox="0 0 680 170" role="img" aria-label="Eight plants spread across a field"></svg><figcaption id="distribution-caption">The field contains eight plants. Their abundance is eight; their distribution is spread out.</figcaption></figure><p>Changing where organisms gather does not necessarily change their abundance. If some die and the survivors gather in one place, <strong>both abundance and distribution may change</strong>.</p>`],
['conditions','Why different places support different organisms',`<p>Species have different needs and tolerances. Conditions that suit one species may not suit another.</p><div class="two-col"><div class="example"><div class="tag">Kahikatea forest</div><p>A canopy usually reduces light reaching the ground. Leaf litter can help retain moisture. Shade-tolerant plants may grow well where exposed lawn plants do not.</p></div><div class="example"><div class="tag">Open lawn</div><p>More direct light and greater exposure may favour different plants. Mowing, trampling, drainage and competition can also affect what grows.</p></div></div><p>Plants use <strong>light energy, carbon dioxide and water</strong> in photosynthesis to make glucose and release oxygen. Glucose is used in respiration and to build materials for growth. Shortages can slow photosynthesis and growth.</p><div class="notice"><b>Observe before concluding.</b>A forest floor is not always wetter or cooler than every open area. Measure the conditions, identify the species and use evidence from the actual site.</div>`]
]},
{id:'sampling',icon:'▦',label:'Sampling ecosystems',short:'Sampling',desc:'Quadrats, random sampling, transects and collecting trustworthy evidence.',meta:'Choosing & improving a method',intro:'Sampling lets ecologists study a manageable part of a habitat and use it to describe a wider pattern.',sections:[
['quadrats','Quadrats and consistent counting',`<p>A <strong>quadrat</strong> is a frame marking a known area. Use it to count plants or animals that move very little, or to estimate percentage cover.</p><ul><li>Keep the quadrat size the same when comparing sample counts.</li><li>Identify the species consistently. Count individuals when they can be distinguished.</li><li>Agree a boundary rule, such as including top and left edges and excluding bottom and right edges. Apply it every time.</li><li>Record <b>zero</b> when the chosen organism is absent.</li><li>For cover, estimate the proportion of the quadrat covered by the chosen species.</li></ul><div class="notice"><b>Know what you counted.</b>On your forest transect, ivy leaves and fern fronds are counting units. Ten fronds do not necessarily mean ten individual fern plants. A whole fern frond is one leaf, not each small leaflet.</div>`],
['random','Random sampling: describing a whole area',`<p>Use random sampling to estimate abundance across an area without choosing your favourite spots.</p><ol class="steps"><li>Define the survey area and place coordinate axes along its edges.</li><li>Generate random coordinate pairs. Place the quadrat at those positions using a consistent reference corner.</li><li>Count the chosen species or estimate cover using the same rules.</li><li>Take enough samples across the area, record the results and calculate a mean if appropriate.</li></ol><p><strong>Selection bias</strong> occurs when the way you choose sites favours particular results. Choosing only flower-filled patches would overestimate flower abundance. Choosing only easy-to-reach places could miss other conditions.</p><div class="notice"><b>A quadrat does not make sampling random.</b>The placement method determines whether sampling is random. Random coordinates are more defensible than throwing a frame, because people can unconsciously choose where to throw.</div>`],
['transects','Transects: following a change across a habitat',`<p>A <strong>transect</strong> is a line along which observations or samples are taken. It is useful across an <strong>environmental gradient</strong>: a gradual change in conditions, such as from a shaded forest into open ground.</p><ol class="steps"><li>Choose the line before looking for the most interesting organisms. Lay a tape across the gradient.</li><li>Place the same-sized quadrat at regular intervals, using the same side of the tape and reference corner.</li><li>Record distance and the count or cover of each species separately.</li><li>Measure relevant abiotic factors at each position.</li><li>Repeat with additional transects to check whether the pattern is consistent.</li></ol><figure class="diagram"><svg viewBox="0 0 720 190" role="img" aria-label="A transect from shade to open ground with quadrats at 0, 2, 4, 6 and 8 metres"><defs><linearGradient id="field"><stop stop-color="#9ec6a7"/><stop offset="1" stop-color="#e4e8ad"/></linearGradient></defs><rect x="10" y="10" width="700" height="140" rx="12" fill="url(#field)"/><text x="30" y="39" fill="#244e3d" font-size="17">Shaded edge</text><text x="560" y="39" fill="#244e3d" font-size="17">Open ground</text><path d="M60 100H655" stroke="#315e4c" stroke-width="3"/>${[0,1,2,3,4].map((n)=>`<rect x="${45+n*145}" y="72" width="38" height="38" fill="#fff9" stroke="#173b30" stroke-width="2"/><text x="${64+n*145}" y="179" text-anchor="middle" fill="#244e3d" font-size="17">${n*2} m</text>`).join('')}</svg><figcaption>Quadrats at regular intervals are <strong>systematic sampling</strong>. Record the organisms and environmental conditions at each point.</figcaption></figure><p>In class, your 15 m forest transect started 2 m inside the edge, with quadrats at 0, 3, 6, 9, 12 and 15 m along the tape. A tape position of 0 m was therefore <strong>2 m from the forest edge</strong>.</p>`],
['choose-method','Choosing the method',`<div class="table-wrap"><table><thead><tr><th>Purpose</th><th>Suitable approach</th><th>Why it helps</th></tr></thead><tbody><tr><td>Estimate typical abundance in a lawn.</td><td>Many randomly located quadrats.</td><td>Reduces selection bias and samples different patches.</td></tr><tr><td>Find how plants change from shade to sunlight.</td><td>Quadrats at intervals along repeated transects.</td><td>Links each sample to its position along a gradient.</td></tr><tr><td>Compare two habitats.</td><td>Consistent quadrat sizes, methods and sampling effort in both.</td><td>Makes comparisons more meaningful.</td></tr></tbody></table></div><p><strong>More quadrats</strong> reduce the influence of one unusual patch. <strong>More transects or sites</strong> show whether a pattern is widespread. <strong>Other days or seasons</strong> show whether it persists over time. Explain which weakness each improvement addresses.</p>`]
]},
{id:'abiotic',icon:'◒',label:'Measuring abiotic factors',short:'Measuring factors',desc:'Equipment, units, methods and mistakes to avoid, including your soil pH method.',meta:'Light · soil · temperature · water',intro:'Measure environmental conditions alongside the organisms. This helps you explain why abundance and distribution might differ.',sections:[
['measurement-guide','Equipment and methods',`<div class="table-wrap"><table><thead><tr><th>Factor</th><th>Equipment / unit</th><th>Method and care</th></tr></thead><tbody><tr><td><b>Light intensity</b></td><td>Light meter<br><b>lux (lx)</b></td><td>Place the sensor at the sampling point, keep its orientation consistent and wait for a settled reading. Avoid shading it with your body.</td></tr><tr><td><b>Soil temperature</b></td><td>Soil thermometer or temperature probe<br><b>°C</b></td><td>Insert the probe gently to the same depth, about 5 cm in your class method. Wait for it to adjust before reading.</td></tr><tr><td><b>Air temperature</b></td><td>Thermometer or probe<br><b>°C</b></td><td>Measure in shade at a consistent height. Keep the sensor away from your body and breath. Allow it to settle.</td></tr><tr><td><b>Soil texture</b></td><td>Trowel, water and texture chart<br><b>Texture category</b></td><td>Take samples from the same soil layer, moisten and rub or roll them. Sand feels gritty, silt smooth and clay sticky.</td></tr><tr><td><b>Soil pH</b></td><td>Prepared soil extract, pH paper and colour chart<br><b>pH scale; no units</b></td><td>Use the same soil-to-water ratio and clean equipment. Compare the paper colour with the chart.</td></tr><tr><td><b>Soil moisture</b></td><td>Soil moisture meter<br><b>Use the device’s scale</b></td><td>Use consistent depth and placement, allow the reading to settle and record the scale used. A classroom meter reading is not automatically a calibrated percentage.</td></tr></tbody></table></div>`],
['soil-ph','Your soil pH method',`<ol class="steps"><li>Measure <strong>20 g of soil</strong> and add <strong>40 mL of distilled water</strong>.</li><li>Stir for <strong>1 minute</strong>.</li><li>Leave for <strong>2–3 minutes</strong>, then filter into a clean container.</li><li>Test the filtered liquid using pH paper. Compare the colour with the chart and record the pH.</li></ol><div class="two-col"><div class="definition"><h3>Reading the scale</h3><p><b>Below 7:</b> acidic<br><b>7:</b> neutral<br><b>Above 7:</b> alkaline</p><p>The <b>lower</b> the pH, the more acidic the sample.</p></div><div class="definition"><h3>Why pH matters</h3><p>pH affects the availability of mineral nutrients and the activity of soil organisms. Different plants tolerate different pH ranges, so pH can influence which species grow in a place.</p></div></div><p>Keep the soil mass, water volume, mixing time and testing method consistent. Use distilled water and clean equipment to reduce contamination.</p><div class="notice"><b>Keep the conclusion local.</b>Testing one forest and one paddock can describe those samples. It cannot establish that every forest has a lower pH than every paddock.</div>`],
['fair-measurements','Making measurements comparable',`<p>Compare like with like. Choose the conditions you need to keep consistent and explain their purpose.</p><ul><li><b>Same depth:</b> soil conditions can change with depth.</li><li><b>Same height and sensor orientation:</b> helps avoid differences caused by the measurement setup.</li><li><b>Similar time and weather:</b> light, air temperature and moisture can vary during a day.</li><li><b>Repeated readings at several positions:</b> captures variation across the habitat.</li><li><b>Suitable measuring equipment:</b> smaller scale divisions can reduce reading uncertainty.</li></ul><p>Do not change a measurement because it conflicts with your prediction. Record it, check the method and investigate the conditions.</p>`]
]},
{id:'data',icon:'▥',label:'Patterns and calculations',short:'Data skills',desc:'Mean, range, percentage points, correlations, anomalies and uncertainty.',meta:'Read evidence with confidence',intro:'Describe what the data show, support it with values, then explain what the evidence can and cannot tell you.',sections:[
['calculations','The calculation toolkit',`<p>The examples here use different numbers from your booklet. Use them as a guide to the method.</p><div class="two-col"><div class="example"><div class="tag">Mean</div><div class="formula">Mean = total ÷ number of values</div><p>Counts: 6, 10, 8 and 12.</p><p>(6 + 10 + 8 + 12) ÷ 4 = <b>9 organisms per quadrat</b>.</p><p>Keep the original type of unit. The mean of percentage covers is a percentage.</p></div><div class="example"><div class="tag">Range</div><div class="formula">Range = highest − lowest</div><p>Counts: 6, 10, 8 and 12.</p><p>12 − 6 = <b>6 organisms per quadrat</b>.</p><p>A small range means these sample values are close together. It does not prove they are accurate.</p></div><div class="example"><div class="tag">Quadrat area</div><div class="formula">Area = length × width</div><p>For a 0.5 m × 0.5 m quadrat:</p><p>0.5 × 0.5 = <b>0.25 m²</b>.</p><p>Convert lengths to metres before calculating an area in m². A 50 cm side is 0.5 m.</p></div><div class="example"><div class="tag">Comparing percentages</div><div class="formula">Change in percentage points<br>= final % − initial %</div><p>Cover increases from 25% to 65%.</p><p>65 − 25 = an increase of <b>40 percentage points</b>.</p><p>This is not a 40% relative increase. Percentage points describe the difference between percentages.</p></div><div class="example"><div class="tag">How many times?</div><div class="formula">Ratio = one value ÷ comparison value</div><p>One location is exposed for 9 hours and another for 3 hours.</p><p>9 ÷ 3 = <b>3 times as long</b>.</p><p>The units cancel when the two values use the same unit.</p></div><div class="example"><div class="tag">Percentage cover</div><div class="formula">Cover = covered area ÷ total area × 100</div><p>If a plant covers 18 of 100 equal grid squares:</p><p>18 ÷ 100 × 100 = <b>18% cover</b>.</p><p>Use a consistent estimate for partly covered squares.</p></div></div>`],
['correlation','Positive, negative and no correlation',`<p>A <strong>correlation</strong> describes how two variables change together. Read the axis labels first: the sign depends on the two variables being compared.</p><figure class="diagram"><div class="switcher" aria-label="Correlation display"><button data-correlation="positive" aria-pressed="true">Positive correlation</button><button data-correlation="negative" aria-pressed="false">Negative correlation</button><button data-correlation="none" aria-pressed="false">No clear correlation</button></div><svg id="correlation-svg" viewBox="0 0 680 300" role="img" aria-label="Positive correlation between soil moisture and earthworm count"></svg><figcaption class="pattern-caption" id="correlation-caption"></figcaption></figure><p>Use <b>“generally increases”</b> or <b>“generally decreases”</b> if not every result follows the pattern exactly. An upward pattern is a <strong>positive correlation</strong>; it does not automatically mean direct proportion.</p><div class="notice"><b>Correlation does not prove causation.</b>Two variables may change together while another factor also changes. For example, damp sites may also be shadier. Moisture and light could both influence the organisms.</div>`],
['evidence','Describing patterns with evidence',`<ol class="steps"><li><b>Name the variables.</b> Say what changes as what changes.</li><li><b>Describe the direction.</b> Increase, decrease, no clear pattern or a change that levels off.</li><li><b>Give two contrasting values with units.</b> State the locations or dates, too.</li><li><b>Describe each species separately.</b> Different species may respond differently.</li><li><b>Explain a possible mechanism.</b> Link the condition to the organism’s needs.</li><li><b>State a limitation.</b> Identify another influence or a limit to the sampling.</li></ol><div class="example"><div class="tag">Illustrative description</div><p>“As distance from the tree increased from 1 m to 7 m, clover cover increased from 15% to 55%. Greater light availability could allow more photosynthesis and growth. However, soil moisture was not controlled, so light may not be the only explanation.”</p></div><p>When drawing a graph, label both axes with the variable and unit, choose even scales and plot carefully. Use a scatter graph to examine the relationship between two numerical variables.</p>`],
['anomalies','Anomalies and outliers',`<p>An <strong>anomaly</strong> or <strong>outlier</strong> is a result that is unusually different from the others or from the overall pattern.</p><div class="example"><div class="tag">Illustrative counts</div><p>7, 9, 8, <strong>29</strong>, 10</p><p>29 is a possible outlier. It might be a recording or counting mistake, or a real cluster of organisms in an unusually suitable patch.</p></div><p>Check the original record, identification, equipment and site conditions. Repeat the measurement if possible. <strong>Do not delete a value simply because it does not fit.</strong> Exclude it only with a justified reason, and record that decision.</p><p>If an error is confirmed and a value is removed, recalculate the mean using the number of values actually retained.</p>`],
['uncertainty','Uncertainty and confidence',`<p><strong>Uncertainty</strong> describes the limits to how sure we can be about a measurement or conclusion. Instruments have limited detail, people estimate differently and organisms vary between places.</p><div class="table-wrap"><table><thead><tr><th>Source of doubt</th><th>Useful improvement</th><th>Why it helps</th></tr></thead><tbody><tr><td>One quadrat happens to land in a dense patch.</td><td>More randomly placed quadrats.</td><td>Reduces the influence of one unusual patch.</td></tr><tr><td>People estimate cover differently.</td><td>Agree a method; use a grid and reference examples.</td><td>Makes estimates more consistent between observers.</td></tr><tr><td>A thermometer has large scale divisions.</td><td>Use a suitable thermometer with smaller divisions.</td><td>Allows a more precise reading.</td></tr><tr><td>Only one day was sampled.</td><td>Repeat on other days or seasons and record conditions.</td><td>Shows whether the pattern persists over time.</td></tr><tr><td>Light and moisture both change.</td><td>Investigate one while keeping other conditions similar.</td><td>Helps separate their possible effects.</td></tr></tbody></table></div><div class="notice"><b>More results are not a cure for every problem.</b>Repeating a biased method can repeat the bias. Recalculating the same mean does not create new evidence. Match the improvement to the weakness.</div>`]
]},
{id:'indicators',icon:'❋',label:'Signs and long-term change',short:'Environmental signs',desc:'Ngā tohu o te taiao, indicator species and combining observations with measurements.',meta:'Observations over time',intro:'Repeated observations help people recognise seasonal patterns and investigate changes in environmental conditions.',sections:[
['tohu','Ngā tohu o te taiao',`<p><strong>Ngā tohu o te taiao</strong> are signs in the natural environment interpreted through mātauranga Māori and local knowledge. This knowledge has developed through careful observation over generations and relationships with particular places.</p><div class="two-col"><div class="definition"><h3>Key words</h3><p><b>Tohu:</b> a sign or indicator.<br><b>Taiao:</b> the natural world or environment.<br><b>Mātauranga Māori:</b> Māori knowledge, values and understandings developed and passed down through generations.</p></div><div class="definition"><h3>Place and context matter</h3><p>Iwi and hapū hold knowledge of their local environments. A sign interpreted in one place may not apply elsewhere. Several tohu are considered together.</p></div></div><p>In your class reading, a <strong>Ngāti Wai example</strong> describes pūkeko moving to higher ground as a possible sign of approaching storms and flooding. This is a locally situated example, not a rule that all pūkeko movement predicts a flood.</p><div class="notice"><b>Keep the meaning and context.</b>Observing a flowering date can supply ecological evidence. A classroom observation on its own is not the same as the wider mātauranga and relationships through which tohu are understood.</div>`],
['records','Observational and instrumental records',`<div class="two-col"><div class="example"><div class="tag">Observational records</div><p>Repeated records of what occurs in nature: first flowering dates, bird behaviour, fern counts or numbers of birds visiting a tree.</p><p>Use consistent identification, recording times and sampling effort.</p></div><div class="example"><div class="tag">Instrumental records</div><p>Equipment measurements of environmental conditions: air temperature, rainfall, soil pH, soil moisture or dissolved oxygen.</p><p>Record the unit, location, method and conditions.</p></div></div><p>Comparing observations with instrumental measurements helps investigate connections. Earlier flowering in warmer years suggests a relationship, but rainfall, daylight, the tree’s condition and other influences may matter too.</p><p>Measurements and locally interpreted signs can contribute different evidence. Use local knowledge with its appropriate context and guidance.</p>`],
['long-term','Why monitor over many years?',`<p>One observation may reflect an unusual season, a recent storm or a temporary disturbance. Longer records can reveal <strong>trends, natural variation and recurring seasonal patterns</strong>.</p><ul><li>Compare equivalent dates or seasons and use the same method.</li><li>Keep the sampling location and effort consistent.</li><li>Record changes to equipment or methods so they can be considered.</li><li>Monitor more than one location or individual before generalising widely.</li><li>Combine biological observations with relevant abiotic measurements.</li></ul><p>Longer records strengthen the evidence, but do not automatically prove a cause. Even many years of observations from one tree do not represent every tree in New Zealand.</p>`],
['indicator-species','Indicators of ecosystem health',`<p>An <strong>environmental indicator</strong> is an observable or measurable sign that provides information about conditions or change. An <strong>indicator species</strong> has a presence or abundance that gives clues about those conditions.</p><div class="example"><div class="tag">Freshwater example</div><p>Many mayfly nymphs need well-oxygenated freshwater and are sensitive to pollution or sediment. Their abundance can contribute evidence about stream health.</p><p>A decline could reflect unsuitable conditions, but also season, flow, temperature, habitat or sampling differences. Check other evidence before naming a cause.</p></div><p>Use several indicators together: organisms, temperature, dissolved oxygen, clarity, bank stability and other relevant measurements. A single species or a single reading cannot describe every aspect of an ecosystem’s health.</p>`]
]},
{id:'restoration',icon:'⌁',label:'Protecting and restoring',short:'Restoration',desc:'Freshwater threats, restoration actions, kaitiakitanga and evidence-based decisions.',meta:'Disruption · care · recovery',intro:'Restoration works best when actions address the causes of damage and are followed by evidence and ongoing care.',sections:[
['freshwater','Water availability and ecosystem health',`<p>Freshwater availability means having enough water of suitable quality when and where organisms need it. Water can be present but too polluted or otherwise unsuitable for particular organisms.</p><div class="table-wrap"><table><thead><tr><th>Process</th><th>Meaning</th></tr></thead><tbody><tr><td><b>Runoff</b></td><td>Water flowing over the land surface into lower areas and waterways.</td></tr><tr><td><b>Infiltration</b></td><td>Water soaking into the soil.</td></tr><tr><td><b>Storage</b></td><td>Water held in soil, wetlands, lakes and other parts of the environment.</td></tr><tr><td><b>Transpiration</b></td><td>Loss of water vapour from plants, mainly through the leaves.</td></tr></tbody></table></div><p>Drought, reduced rainfall, seasonal changes and higher evaporation can reduce available water. Human influences include excessive extraction, wetland drainage, deforestation and pollution.</p>`],
['damage','How damage affects organisms',`<p>Connect the human activity to an abiotic change, then to the needs of living organisms.</p><div class="two-col"><div class="example"><div class="tag">Removing bank vegetation</div><p>Fewer roots can leave banks less stable. Erosion adds sediment to the stream. Suspended sediment reduces clarity and can interfere with feeding or smother habitats.</p><p>Less shade can increase water temperature. Warmer water can hold less dissolved oxygen, potentially making conditions less suitable for sensitive organisms.</p></div><div class="example"><div class="tag">Stock access and polluted runoff</div><p>Trampling can damage banks. Waste, sediment and nutrients can enter the water. Too many nutrients can encourage excessive algal growth; decay of organic material can use up dissolved oxygen.</p><p>The effects depend on how much enters, the stream’s flow and the organisms present.</p></div></div><p><strong>Biodiversity</strong> is the variety of living organisms. Damage may reduce sensitive species while favouring more tolerant ones, changing the community.</p>`],
['actions','Restoration actions and why they help',`<div class="restoration-actions"><article><h3>Fence waterways</h3><p>Keep stock away from banks and water. This reduces trampling, bank damage and direct entry of animal waste.</p></article><article><h3>Plant stream banks</h3><p>Locally appropriate plants can stabilise banks with roots, provide shade and habitat, and slow some sediment-carrying runoff.</p></article><article><h3>Protect and restore wetlands</h3><p>Wetlands provide habitat, store water and can slow water movement and retain some sediment and nutrients. They need suitable water flows and ongoing care.</p></article><article><h3>Manage water and pollution at source</h3><p>Reduce excessive extraction and prevent contaminants entering waterways. Bank planting alone cannot remove every source of damage.</p></article></div><p>Restoration aims to help a damaged ecosystem recover its condition and functions. <strong>Resilience</strong> is its ability to withstand disturbance and recover. Recovery can take years and may require several actions together.</p>`],
['kaitiakitanga','Kaitiakitanga and trade-offs',`<p><strong>Kaitiakitanga</strong> is commonly described as guardianship or stewardship. It involves responsibilities and relationships in caring for the environment, grounded in Māori values and whakapapa, including care for future generations.</p><p>In ecosystem management this can involve protecting habitats, restoring native vegetation, monitoring change and sustaining care over generations. Local iwi and hapū knowledge and priorities matter.</p><div class="example"><div class="tag">A trade-off</div><p>Fencing and planting a stream margin can improve habitat and bank stability, but takes money, time and some land out of grazing. A recommendation should recognise these costs as well as the environmental benefits.</p></div><p>A <strong>trade-off</strong> means gaining a benefit while accepting a cost or loss elsewhere. Naming a drawback does not cancel the benefit; it helps make the decision realistic.</p>`],
['monitoring','Judging success using evidence',`<ol class="steps"><li><b>Define success:</b> clearer water, more stable banks, suitable temperatures or recovery of sensitive species.</li><li><b>Collect a baseline:</b> record conditions before the action where possible.</li><li><b>Monitor repeatedly:</b> use the same methods and comparable seasons over several years.</li><li><b>Compare sites:</b> similar untreated areas and multiple restored sites can strengthen the evidence.</li><li><b>Measure several indicators:</b> combine abiotic conditions and living organisms.</li><li><b>Review and maintain:</b> replace failed plants, maintain fences, manage weeds and adjust actions.</li></ol><div class="notice"><b>Check what the comparison can show.</b>Two different sites may have differed before restoration. If fencing and planting happened together, a difference cannot be attributed to planting alone. Better results in a measured feature do not prove that every problem is fixed.</div><p>Make a recommendation that links <strong>action, scientific reason, supporting evidence, a trade-off and a plan to monitor</strong>. Explain why sustained care matters.</p>`]
]},
{id:'writing',icon:'≡',label:'Building an explanation',short:'Writing support',desc:'Turn scientific knowledge and evidence into a clear, connected explanation.',meta:'Describe · explain · evaluate',intro:'Use this page for the structure of a response. Choose the science and evidence that fit the question in your booklet.',sections:[
['command-words','What the instruction means',`<div class="table-wrap"><table><thead><tr><th>Instruction</th><th>What to do</th><th>Useful start</th></tr></thead><tbody><tr><td><b>Define</b></td><td>Give the precise meaning.</td><td>“Abundance means…”</td></tr><tr><td><b>Describe</b></td><td>State what happens or what the data show.</td><td>“As … increases, … generally decreases.”</td></tr><tr><td><b>Compare</b></td><td>State similarities or differences using both sets of evidence.</td><td>“At site A …, whereas at site B …”</td></tr><tr><td><b>Explain</b></td><td>Give a scientific reason and link it to the outcome.</td><td>“… because …, so …”</td></tr><tr><td><b>Evaluate / judge a claim</b></td><td>Decide how far the evidence supports it and explain the limits.</td><td>“The evidence supports …, but cannot show …”</td></tr><tr><td><b>Justify a recommendation</b></td><td>Choose an action and explain why the evidence supports that choice.</td><td>“I recommend … because …”</td></tr></tbody></table></div>`],
['paragraphs','Connect evidence to science',`<div class="levels"><div class="level"><strong>Point</strong><span>State the pattern or main idea clearly.</span></div><div class="level"><strong>Evidence</strong><span>Use relevant values, units, species, dates or locations.</span></div><div class="level"><strong>Reason</strong><span>Explain why this could happen, using the organism’s needs.</span></div><div class="level"><strong>Limit</strong><span>Explain a specific uncertainty or another possible influence.</span></div></div><p style="margin-top:22px">Use <strong>because</strong> to give a reason, <strong>so</strong> or <strong>therefore</strong> to link an outcome, and <strong>however</strong> to introduce a limitation.</p><div class="example"><div class="tag">An example of linking ideas</div><p>“The leaf-litter sample contained more woodlice. Moist leaf litter may reduce water loss from their bodies, so more can survive there. However, shelter and food availability may also differ between the sites.”</p></div><p>Add numerical evidence when the question supplies data. Explain each organism separately if their patterns differ.</p>`],
['claims','Judge the size of the claim',`<p>Look out for words such as <strong>always, every, everywhere, only</strong> and <strong>proves</strong>. They may go beyond what a small investigation can show.</p><ul><li>A relationship does not establish one definite cause.</li><li>One location or individual does not represent every location or individual.</li><li>One afternoon cannot describe all seasons.</li><li>A change in one indicator does not measure the whole ecosystem.</li><li>An improvement needs a specific reason: say how it addresses the weakness.</li></ul><p>You can support part of a claim while rejecting a broader conclusion. State exactly what the evidence does support.</p>`],
['use-booklet','Using this site with your booklet',`<ol class="steps"><li>Try the practice from memory first.</li><li>When stuck, identify the missing idea: a definition, a method, a calculation or a scientific link.</li><li>Search here or open the relevant topic. Read the explanation and example.</li><li>Return to your booklet and use the idea in your own words, with the data provided there.</li><li>Check you have addressed every bullet point, used correct units and explained your reasoning.</li></ol><p>Topic explanations and illustrative examples are here to support your thinking. Keep the practice booklet beside you for the questions.</p>`]
]}
];
const glossary=[['Abundance','The number of individuals of a species, or a stated measure such as percentage cover, in an area.','foundations','abundance'],['Abiotic factor','A non-living physical or chemical condition, such as light, temperature, water or soil pH.','foundations','factors'],['Anomaly / outlier','A result unusually different from the others or from the pattern. Investigate before deciding whether to exclude it.','data','anomalies'],['Bias','A systematic influence that favours some results, such as sampling only patches with many flowers.','sampling','random'],['Biodiversity','The variety of living organisms in an area.','restoration','damage'],['Biotic factor','A living component or an interaction between living organisms, such as competition or predation.','foundations','factors'],['Community','All the populations of different species living in an area.','foundations','organisation'],['Correlation','A relationship between two variables; it does not on its own prove causation.','data','correlation'],['Distribution','Where organisms are found and how they are spread out across an area.','foundations','abundance'],['Ecosystem','A community interacting with its non-living environment.','foundations','organisation'],['Environmental gradient','A gradual change in a condition across an area, such as light intensity from shade to open ground.','sampling','transects'],['Habitat','The place where an organism lives.','foundations','organisation'],['Indicator','An observable or measurable sign that provides clues about conditions or change.','indicators','indicator-species'],['Kaitiakitanga','Guardianship and responsibilities in caring for the environment, grounded in Māori values and relationships, including care for future generations.','restoration','kaitiakitanga'],['Mean','The sum of the values divided by the number of values.','data','calculations'],['Ngā tohu o te taiao','Signs in the natural environment interpreted through mātauranga Māori and local knowledge.','indicators','tohu'],['Percentage points','The difference between two percentages: 30% to 50% is an increase of 20 percentage points.','data','calculations'],['Population','All the organisms of one species living in a particular area.','foundations','organisation'],['Quadrat','A frame marking a known area for counting organisms or estimating cover.','sampling','quadrats'],['Random sampling','Choosing sampling positions by chance, for example using random coordinates, to reduce selection bias.','sampling','random'],['Range','Highest value minus lowest value.','data','calculations'],['Resilience','The ability of an ecosystem to withstand disturbance and recover.','restoration','actions'],['Restoration','Actions that help a damaged ecosystem recover its condition and functions.','restoration','actions'],['Systematic sampling','Sampling using a set rule, such as quadrats at regular intervals along a transect.','sampling','transects'],['Trade-off','Gaining a benefit while accepting a cost or loss elsewhere.','restoration','kaitiakitanga'],['Transect','A line across an area along which observations or samples are taken.','sampling','transects'],['Uncertainty','Limits to how sure we can be about a measurement or conclusion.','data','uncertainty']];

ted systems.</text></svg>`;

function home(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">Year 9 Science / Ecosystems</div><h1>See the bigger<br><em>picture.</em></h1><p>Your guide to the science behind ecosystems. Find an explanation, make the connection, then return to your practice booklet.</p><span class="pill">Classroom knowledge, all in one place</span></div>${forest}</section><div class="section-top"><h2>Find the idea you need</h2><p>Choose a topic, or search for a key word.</p></div><div class="topic-grid">${topics.map(t=>`<a class="topic-card" href="#${t.id}"><span class="topic-icon" aria-hidden="true">${t.icon}</span><h3>${t.label}</h3><p>${t.desc}</p><small>${t.meta}</small></a>`).join('')}<a class="topic-card" href="#glossary"><span class="topic-icon" aria-hidden="true">Aa</span><h3>Key word glossary</h3><p>Clear definitions for the scientific vocabulary used throughout this topic.</p><small>${glossary.length} useful terms</small></a></div><aside class="help-banner"><div><h3>Stuck on an explanation?</h3><p>Find the science you need, then link your evidence to a reason using <strong>because</strong>, <strong>so</strong> and <strong>therefore</strong>.</p></div><a class="btn" href="#writing">Get writing support</a></aside>${footer()}`;}
function render(){const parts=location.hash.slice(1).split('/');const id=parts[0]||'home';const sectionId=parts[1];const topic=topics.find(t=>t.id===id);navigation.querySelectorAll('a').forEach(a=>{if(a.dataset.nav===id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
if(id==='glossary'){document.title='Key word glossary | Ecosystems';main.innerHTML=`<a class="backlink" href="#home">All revision topics</a><header class="page-head"><div class="eyebrow">The language of ecology</div><h1>Key word glossary</h1><p class="intro">A quick reference for the ideas in your practice booklet. Select a term to read the full explanation.</p></header><div class="glossary-grid">${glossary.map(([term,definition,t,s])=>`<article class="word-card"><h2><a href="#${t}/${s}">${term}</a></h2><p>${definition}</p></article>`).join('')}</div>${footer()}`;}
else if(topic){document.title=topic.label+' | Ecosystems';const index=topics.indexOf(topic);main.innerHTML=`<a class="backlink" href="#home">All revision topics</a><header class="page-head"><div class="eyebrow">${topic.meta}</div><h1>${topic.label}</h1><p class="intro">${topic.intro}</p></header><div class="jump-links" aria-label="Sections on this page">${topic.sections.map(([s,title])=>`<a href="#${id}/${s}">${title}</a>`).join('')}</div>${topic.sections.map(([s,title,html])=>`<section class="content-section" id="section-${s}" aria-labelledby="heading-${s}"><h2 id="heading-${s}">${title}</h2>${html}</section>`).join('')}<div class="bottom-nav"><a class="btn light" href="#home">All topics</a>${index<topics.length-1?`<a class="btn" href="#${topics[index+1].id}">Next: ${topics[index+1].short}</a>`:`<a class="btn" href="#glossary">Key word glossary</a>`}</div>${footer()}`;if(id==='foundations')drawDistribution('spread');if(id==='data')drawCorrelation('positive');}
else{document.title='Ecosystems | Year 9 Science';main.innerHTML=home();navigation.querySelector('[data-nav="home"]').setAttribute('aria-current','page');}
document.getElementById('sidebar').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');closeSearch();if(sectionId&&document.getElementById('section-'+sectionId)){document.getElementById('section-'+sectionId).scrollIntoView({behavior:'instant'});}else{window.scrollTo({top:0,behavior:'instant'});}main.focus({preventScroll:true});}
function drawDistribution(mode){const svg=document.getElementById('distribution-svg');if(!svg)return;const points=mode==='spread'?[[65,48],[225,42],[398,55],[585,45],[128,126],[310,118],[476,120],[625,130]]:[[260,62],[295,49],[330,70],[274,106],[313,116],[351,102],[366,60],[390,121]];svg.innerHTML='<rect x="5" y="5" width="670" height="160" rx="10" fill="#d8e9c8"/>'+points.map(([x,y])=>`<g transform="translate(${x} ${y})"><path d="M0 14V-8" stroke="#297551" stroke-width="3"/><ellipse cx="-7" cy="0" rx="8" ry="4" transform="rotate(30)" fill="#3b9161"/><ellipse cx="7" cy="0" rx="8" ry="4" transform="rotate(-30)" fill="#3b9161"/><circle cy="-10" r="5" fill="#fff9e8"/></g>`).join('');svg.setAttribute('aria-label','Eight plants '+(mode==='spread'?'spread across':'clustered in the centre of')+' a field');document.getElementById('distribution-caption').textContent=mode==='spread'?'The field contains eight plants. Their abundance is eight; their distribution is spread out.':'The field still contains eight plants. Abundance is unchanged, but their distribution is now clustered.';document.querySelectorAll('[data-pattern]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pattern===mode)));}
function drawCorrelation(mode){const svg=document.getElementById('correlation-svg');if(!svg)return;const ys=mode==='positive'?[211,195,200,163,145,154,106,92,76,43]:mode==='negative'?[44,69,62,103,128,117,163,178,191,214]:[104,192,65,163,125,56,210,102,169,78];const xLabel=mode==='positive'?'Soil moisture':mode==='negative'?'Distance from pond':'Light intensity';const yLabel=mode==='positive'?'Earthworm count':mode==='negative'?'Frog count':'Beetle count';const labels={positive:'As soil moisture increases, earthworm count generally increases. Both variables change in the same direction: a positive correlation.',negative:'As distance from the pond increases, frog count generally decreases. The variables change in opposite directions: a negative correlation.',none:'As light intensity increases, beetle count has no clear upward or downward pattern: no clear correlation.'};svg.innerHTML=`<path d="M80 25v220h555" fill="none" stroke="#607b6c" stroke-width="2"/><text x="355" y="286" text-anchor="middle" font-size="17" fill="#244e3d">${xLabel} (increasing)</text><text x="24" y="140" transform="rotate(-90 24 140)" text-anchor="middle" font-size="17" fill="#244e3d">${yLabel}</text>${ys.map((y,i)=>`<circle cx="${112+i*53}" cy="${y}" r="6" fill="#278061"/>`).join('')}`;svg.setAttribute('aria-label',mode==='none'?'No clear correlation between '+xLabel+' and '+yLabel:mode+' correlation between '+xLabel+' and '+yLabel);document.getElementById('correlation-caption').textContent=labels[mode]+' Illustrative pattern, not measured class data.';document.querySelectorAll('[data-correlation]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.correlation===mode)));}
function strip(html){const div=document.createElement('div');div.innerHTML=html;return div.textContent.replace(/\s+/g,' ').trim();}
function normalise(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
const searchIndex=topics.flatMap(t=>t.sections.map(([s,title,html])=>({title,topic:t.label,href:'#'+t.id+'/'+s,text:strip(html)}))).concat(glossary.map(([title,text,t,s])=>({title,topic:'Key word glossary',href:'#'+t+'/'+s,text})));
const search=document.getElementById('search'),results=document.getElementById('results');
function closeSearch(){results.hidden=true;search.setAttribute('aria-expanded','false');}
search.addEventListener('input',()=>{const q=normalise(search.value.trim());if(q.length<2){closeSearch();return;}const words=q.split(/\s+/);const hits=searchIndex.map(x=>({...x,score:words.reduce((score,w)=>score+(normalise(x.title).includes(w)?4:0)+(normalise(x.text).includes(w)?1:0),0)})).filter(x=>words.every(w=>normalise(x.title+' '+x.text+' '+x.topic).includes(w))).sort((a,b)=>b.score-a.score).slice(0,8);results.replaceChildren();if(!hits.length){const p=document.createElement('p');p.textContent='No matches yet. Try “quadrat”, “pH”, “mean” or “restoration”.';results.append(p);}hits.forEach(x=>{const a=document.createElement('a');a.href=x.href;const b=document.createElement('b');b.textContent=x.title;const small=document.createElement('small');small.textContent=x.topic;a.append(b,small);a.addEventListener('click',()=>{if(location.hash===x.href){render();}closeSearch();search.value='';});results.append(a);});results.hidden=false;search.setAttribute('aria-expanded','true');document.getElementById('search-status').textContent=hits.length+' matching results';});
search.addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch();if(e.key==='ArrowDown'&&!results.hidden){e.preventDefault();results.querySelector('a')?.focus();}if(e.key==='Enter'&&!results.hidden){const first=results.querySelector('a');if(first){first.click();}}});
results.addEventListener('keydown',e=>{const links=[...results.querySelectorAll('a')];const i=links.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();links[Math.min(i+1,links.length-1)]?.focus();}if(e.key==='ArrowUp'){e.preventDefault();if(i<=0)search.focus();else links[i-1].focus();}if(e.key==='Escape'){closeSearch();search.focus();}});
document.addEventListener('click',e=>{if(e.target.closest('.skip')){e.preventDefault();main.focus();main.scrollIntoView();return;}if(!e.target.closest('.searchwrap'))closeSearch();const d=e.target.closest('[data-pattern]');if(d)drawDistribution(d.dataset.pattern);const c=e.target.closest('[data-correlation]');if(c)drawCorrelation(c.dataset.correlation);if(window.innerWidth<=800&&!e.target.closest('.sidebar')&&!e.target.closest('#menu')){document.getElementById('sidebar').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');}});
document.getElementById('menu').addEventListener('click',()=>{const open=document.getElementById('sidebar').classList.toggle('open');document.getElementById('menu').setAttribute('aria-expanded',String(open));});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('sidebar').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');closeSearch();}});
window.addEventListener('hashchange',render);render();
</script>
