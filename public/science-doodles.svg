<svg width="820" height="170" viewBox="0 0 820 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#F2F7F9" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="redGold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#CF082B"/>
      <stop offset="1" stop-color="#F0A05F"/>
    </linearGradient>
    <linearGradient id="blueTeal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#365F72"/>
      <stop offset="1" stop-color="#82ADBF"/>
    </linearGradient>
    <linearGradient id="violetBlue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7A6EE6"/>
      <stop offset="1" stop-color="#6BAED0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203445" flood-opacity="0.13"/>
    </filter>
  </defs>

  <!-- Atom -->
  <g transform="translate(20 20)" filter="url(#shadow)">
    <rect width="112" height="112" rx="28" fill="url(#tile)" stroke="#DCE7EC"/>
    <g transform="translate(18 22)" stroke="#365F72" stroke-width="3.2" stroke-linecap="round">
      <ellipse cx="38" cy="34" rx="34" ry="12"/>
      <ellipse cx="38" cy="34" rx="34" ry="12" transform="rotate(60 38 34)"/>
      <ellipse cx="38" cy="34" rx="34" ry="12" transform="rotate(120 38 34)"/>
      <circle cx="38" cy="34" r="6.5" fill="#CF082B" stroke="none"/>
      <circle cx="72" cy="34" r="4" fill="#D8B35C" stroke="none"/>
      <circle cx="21" cy="7" r="4" fill="#82ADBF" stroke="none"/>
    </g>
  </g>

  <!-- Flask -->
  <g transform="translate(153 34)" filter="url(#shadow)">
    <rect width="118" height="118" rx="30" fill="url(#tile)" stroke="#DCE7EC"/>
    <g transform="translate(26 17)">
      <path d="M22 0H52" stroke="#365F72" stroke-width="5" stroke-linecap="round"/>
      <path d="M29 0V24L8 67C4 75 9 84 19 84H56C66 84 71 75 67 67L46 24V0" stroke="#365F72" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M14 54C27 48 36 62 59 51L67 67C71 75 66 84 56 84H19C9 84 4 75 8 67L14 54Z" fill="url(#redGold)"/>
      <circle cx="27" cy="64" r="3" fill="#FFF8E4"/>
      <circle cx="46" cy="70" r="2.5" fill="#FFF8E4"/>
    </g>
  </g>

  <!-- DNA -->
  <g transform="translate(298 17)" filter="url(#shadow)">
    <rect width="116" height="130" rx="30" fill="url(#tile)" stroke="#DCE7EC"/>
    <g transform="translate(29 15)" stroke-linecap="round">
      <path d="M7 0C54 18 8 44 53 62C82 73 66 95 34 102" stroke="url(#blueTeal)" stroke-width="5.5"/>
      <path d="M55 0C8 18 54 44 9 62C-20 73 -4 95 28 102" stroke="url(#redGold)" stroke-width="5.5"/>
      <g stroke="#708391" stroke-width="2.2" opacity="0.82">
        <path d="M16 10H46"/><path d="M22 28H40"/><path d="M16 47H46"/><path d="M14 65H48"/><path d="M20 84H42"/>
      </g>
    </g>
  </g>

  <!-- Wave -->
  <g transform="translate(440 33)" filter="url(#shadow)">
    <rect width="132" height="112" rx="28" fill="url(#tile)" stroke="#DCE7EC"/>
    <path d="M20 58H112" stroke="#A8B7C1" stroke-width="2"/>
    <path d="M66 23V90" stroke="#CF082B" stroke-opacity="0.5" stroke-width="2.5" stroke-dasharray="5 6"/>
    <path d="M18 58C28 33 39 33 49 58C59 83 70 83 80 58C90 33 101 33 112 58" stroke="url(#violetBlue)" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="66" cy="58" r="5.5" fill="#CF082B"/>
  </g>

  <!-- Circuit -->
  <g transform="translate(598 23)" filter="url(#shadow)">
    <rect width="112" height="122" rx="29" fill="url(#tile)" stroke="#DCE7EC"/>
    <g transform="translate(18 27)" stroke="#365F72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 34H18V15H48V34H77"/>
      <path d="M20 25V43"/>
      <path d="M28 21V47"/>
      <circle cx="59" cy="34" r="14" fill="#82ADBF" stroke="none"/>
      <path d="M51 34H67" stroke="#FFFFFF"/>
      <path d="M59 26V42" stroke="#FFFFFF"/>
      <path d="M18 34H7V63H67V48"/>
    </g>
  </g>

  <!-- Microscope -->
  <g transform="translate(724 27)" filter="url(#shadow)">
    <rect width="76" height="116" rx="26" fill="url(#tile)" stroke="#DCE7EC"/>
    <g transform="translate(11 14)" fill="#365F72">
      <rect x="22" y="0" width="9" height="34" rx="4.5" transform="rotate(33 22 0)"/>
      <rect x="31" y="19" width="9" height="38" rx="4.5" transform="rotate(-18 31 19)"/>
      <path d="M4 66C6 50 14 41 28 38L34 45C24 49 20 56 19 66H4Z"/>
      <rect x="2" y="65" width="50" height="8" rx="4"/>
      <rect x="25" y="50" width="34" height="6" rx="3"/>
      <circle cx="49" cy="43" r="7" fill="#CF082B"/>
    </g>
  </g>
</svg>
