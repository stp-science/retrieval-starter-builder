<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".98"/>
      <stop offset=".48" stop-color="#EAF7FB" stop-opacity=".96"/>
      <stop offset="1" stop-color="#CFE8F0" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="tileRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".52" stop-color="#FFF1F4"/>
      <stop offset="1" stop-color="#F3D7DE"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8BF5FF"/>
      <stop offset=".55" stop-color="#3ED5E8"/>
      <stop offset="1" stop-color="#1799C0"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#B0FFE8"/>
      <stop offset=".55" stop-color="#62E5C4"/>
      <stop offset="1" stop-color="#25B79E"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF7A91"/>
      <stop offset=".5" stop-color="#EF3154"/>
      <stop offset="1" stop-color="#B90732"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFE7A1"/>
      <stop offset=".5" stop-color="#F5C75B"/>
      <stop offset="1" stop-color="#C98A1E"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#203F5B"/>
      <stop offset="1" stop-color="#0A1728"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0B2234" flood-opacity=".20"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="20" y="38" width="170" height="210" rx="38" fill="url(#tile)" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="215" y="58" width="170" height="210" rx="38" fill="url(#tileRed)" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="410" y="28" width="170" height="210" rx="38" fill="url(#tile)" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="605" y="62" width="170" height="210" rx="38" fill="url(#tile)" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="800" y="34" width="170" height="210" rx="38" fill="url(#tileRed)" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="995" y="54" width="170" height="210" rx="38" fill="url(#tile)" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <g opacity=".38" fill="#fff">
    <ellipse cx="78" cy="74" rx="38" ry="15"/>
    <ellipse cx="272" cy="94" rx="36" ry="14"/>
    <ellipse cx="470" cy="64" rx="38" ry="15"/>
    <ellipse cx="662" cy="98" rx="36" ry="14"/>
    <ellipse cx="858" cy="70" rx="36" ry="14"/>
    <ellipse cx="1053" cy="90" rx="38" ry="15"/>
  </g>

  <!-- atom -->
  <g transform="translate(105 143)" stroke="url(#cyan)" stroke-width="8" stroke-linecap="round" fill="none">
    <ellipse rx="56" ry="22" transform="rotate(18)"/>
    <ellipse rx="56" ry="22" transform="rotate(78)"/>
    <ellipse rx="56" ry="22" transform="rotate(138)"/>
  </g>
  <circle cx="105" cy="143" r="12" fill="url(#red)" filter="url(#glow)"/>
  <circle cx="158" cy="160" r="7" fill="#FFD36A"/>

  <!-- flask -->
  <g transform="translate(300 159)">
    <path d="M-22 -71h44M-12 -70v52L-52 49c-10 18 2 37 23 37h58c21 0 33-19 23-37L12-18v-52" stroke="url(#navy)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-41 39c20-8 38 7 58 2 9-2 17-6 25-11l12 21c8 14-1 29-18 29h-72c-17 0-26-15-18-29l13-22z" fill="url(#red)" opacity=".96"/>
    <circle cx="18" cy="26" r="8" fill="#FFD6DE"/>
    <circle cx="-11" cy="14" r="6" fill="#FFF" opacity=".8"/>
  </g>

  <!-- DNA -->
  <g transform="translate(495 133)" stroke-linecap="round" stroke-width="9" fill="none">
    <path d="M-40-72C35-48 35 48-40 72" stroke="url(#cyan)"/>
    <path d="M40-72C-35-48-35 48 40 72" stroke="url(#aqua)"/>
    <path d="M-22-51H22M-31-22H31M-33 10H33M-26 41H26" stroke="url(#gold)" stroke-width="7"/>
  </g>

  <!-- waveform -->
  <g transform="translate(690 164)">
    <path d="M-64 0h18l13-38 18 78 19-104 18 128 17-88 14 34h25" stroke="url(#cyan)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-67 72h134" stroke="#153147" stroke-opacity=".12" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-46" cy="0" r="5" fill="#FF3158"/>
    <circle cx="53" cy="10" r="5" fill="#FFD36A"/>
  </g>

  <!-- circuit -->
  <g transform="translate(885 140)" stroke="url(#navy)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M-62-35h34v-34h58v36h36v76H28v37h-60V43h-34z"/>
    <circle cx="-62" cy="-35" r="10" fill="url(#red)" stroke="none"/>
    <circle cx="66" cy="43" r="10" fill="url(#aqua)" stroke="none"/>
    <circle cx="28" cy="80" r="10" fill="url(#gold)" stroke="none"/>
    <rect x="-22" y="-13" width="44" height="28" rx="7" fill="url(#cyan)" stroke="none"/>
  </g>

  <!-- microscope -->
  <g transform="translate(1080 157)" stroke="url(#navy)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M-8-75l33 27-21 27-34-27z" fill="url(#cyan)" stroke="none"/>
    <path d="M-16-39c27 17 38 43 22 67-12 18-35 22-54 11"/>
    <path d="M-40 38h78M-55 76h102"/>
    <path d="M12-10l27 24M31 9l-20 26"/>
  </g>
  <circle cx="1083" cy="180" r="9" fill="url(#red)"/>

  <g fill="#FFFFFF" opacity=".75">
    <circle cx="52" cy="72" r="4"/><circle cx="358" cy="93" r="4"/><circle cx="558" cy="61" r="4"/>
    <circle cx="748" cy="100" r="4"/><circle cx="941" cy="72" r="4"/><circle cx="1140" cy="92" r="4"/>
  </g>
</svg>