<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" fill="none">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.48" stop-color="#F5FAFD"/>
      <stop offset="1" stop-color="#DDEAF2"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#BFD4E0" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#163F58"/>
      <stop offset="0.48" stop-color="#2C7192"/>
      <stop offset="1" stop-color="#0B2E45"/>
    </linearGradient>
    <linearGradient id="blueHi" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#74C7E7"/>
      <stop offset="1" stop-color="#1D5E80"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF5A57"/>
      <stop offset=".5" stop-color="#E31333"/>
      <stop offset="1" stop-color="#8F001C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF0A0"/>
      <stop offset=".45" stop-color="#F1B735"/>
      <stop offset="1" stop-color="#B56E08"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FF695D"/>
      <stop offset=".55" stop-color="#E5172D"/>
      <stop offset="1" stop-color="#F29A21"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(88 66) rotate(48) scale(150)">
      <stop stop-color="#FFFFFF" stop-opacity=".85"/>
      <stop offset="1" stop-color="#A9D3E7" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#173345" flood-opacity=".24"/>
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#FFFFFF" flood-opacity=".8"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="iconShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#0B2E45" flood-opacity=".22"/>
    </filter>
    <g id="tileBase">
      <rect width="170" height="170" rx="42" fill="url(#tile)" stroke="url(#edge)" stroke-width="2"/>
      <rect x="8" y="8" width="154" height="154" rx="35" fill="url(#glow)" opacity=".7"/>
      <path d="M28 20C58 5 112 5 145 22" stroke="white" stroke-width="8" stroke-linecap="round" opacity=".34"/>
    </g>
  </defs>

