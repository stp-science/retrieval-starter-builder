name: Deploy Curriculum App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply safe source fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/page.tsx")
          source = path.read_text()

          old_default = 'const [selected, setSelected] = useState<string[]>(["y9-pressure-fluids"]);'
          new_default = 'const [selected, setSelected] = useState<string[]>([]);'
          if old_default not in source:
              raise SystemExit("Legacy Pressure and Fluids default was not found; refusing to build an unexpected source state.")
          source = source.replace(old_default, new_default, 1)

          old_cloze = '''function makeCloze(answer: string) {
            const words = answer.match(/[A-Za-z][A-Za-z-]*/g) ?? [];
            const candidates = words
              .filter((word) => word.length > 3 && !clozeStopWords.has(word.toLowerCase()))
              .sort((left, right) => right.length - left.length);
            const missing = candidates[0] ?? words.sort((left, right) => right.length - left.length)[0] ?? answer;
            if (!missing) return { text: "________________", missing: answer };
            const escaped = missing.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\\\$&");
            const text = answer.replace(new RegExp(`\\\\b${escaped}\\\\b`, "i"), "________________");
            return { text: text === answer ? "________________" : text, missing };
          }'''
          new_cloze = '''function makeCloze(question: string, answer: string) {
            const words = answer.match(/[A-Za-z][A-Za-z-]*/g) ?? [];
            const candidates = words
              .filter((word) => word.length > 3 && !clozeStopWords.has(word.toLowerCase()))
              .sort((left, right) => right.length - left.length);
            const missing = candidates[0] ?? words.sort((left, right) => right.length - left.length)[0] ?? answer;
            const questionStem = question.trim();
            if (!missing) return { text: `${questionStem} ________________`, missing: answer };
            const escaped = missing.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\\\$&");
            const text = answer.replace(new RegExp(`\\\\b${escaped}\\\\b`, "i"), "________________");
            const visibleContext = text.replace(/[_\\s.,;:!?()\\[\\]{}-]/g, "");
            if (text === answer || visibleContext.length < 8) {
              return { text: `${questionStem} ________________`, missing: answer };
            }
            return { text, missing };
          }'''
          if old_cloze not in source:
              raise SystemExit("Expected cloze generator source was not found; refusing to build an unexpected source state.")
          source = source.replace(old_cloze, new_cloze, 1)

          old_call = '() => generated.map((question) => ({ ...question, ...makeCloze(question.a) })),'
          new_call = '() => generated.map((question) => ({ ...question, ...makeCloze(question.q, question.a) })),'
          if old_call not in source:
              raise SystemExit("Expected cloze generator call was not found; refusing to build an unexpected source state.")
          source = source.replace(old_call, new_call, 1)

          path.write_text(source)
          PY

      - name: Build static site
        run: npx next build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
