name: Deploy Curriculum App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove legacy default topic selection
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/page.tsx")
          source = path.read_text()
          old = 'const [selected, setSelected] = useState<string[]>(["y9-pressure-fluids"]);'
          new = 'const [selected, setSelected] = useState<string[]>([]);'
          if old not in source:
              raise SystemExit("Legacy Pressure and Fluids default was not found; refusing to build an unexpected source state.")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Build static site
        run: npx next build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
